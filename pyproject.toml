[project]
name = "revenue-ops-copilot"
version = "0.1.0"
description = "Revenue Ops Copilot MVP backend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "httpx>=0.27.0",
    "ddgs>=9.0.0",
    "duckduckgo-search>=7.0.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langfuse>=3.0.0",
    "langgraph>=1.0.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:cacheprovider"]
